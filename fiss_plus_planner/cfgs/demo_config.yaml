OUTPUT_DIR: "data/output/"
INPUT_DIR: "data/demo/"
FILES: ["DEU_Flensburg-1_1_T-1.xml"] # empty by default if you want to run all the scenario files under the input directory

PLANNER: "FOP" # the name of the planner to be used, can be: FOP, FOP+, FISS, FISS+, CVAE
N_W_SAMPLE: 5 # number of lateral offset samples
N_S_SAMPLE: 5 # number of longitudinal speed samples
N_T_SAMPLE: 5 # number of time horizon samples
SAVE_GIF: False # save the animation as a .gif file
SAVE_MEASUREMENTS: False # save the measurement data as .csv file
