#Important parameter relevant to runtime：
#   self.min_t = 3.0 #check the code in fiss_plus_planner/planners/frenet_optimal_planner.py      
#   self.max_t = 5.0  
OUTPUT_DIR: "data/output/"
MEASUREMENTS_DIR: "data/measurements/"
INPUT_DIR: "data/demo/UsedForSelfEvaluation" # the directory where the scenario files are located, it should contain the xml files of the scenarios to be tested, you can specify the scenario files to be tested by editing the FILES parameter below, if FILES is empty, it will run all the scenario files under this directory
# INPUT_DIR: "data/demo"
FILES: [AUT_Haag-15_1_T-9.xml] # empty by default if you want to run all the scenario files under the input directory

PLANNER: "Sparse_FOP" # the name of the planner to be used, can be: FOP, FOP+, CEM, MPPI, FISS, FISS+, Sparse, Sparse_Optimized, FOP_CPP, FISS+_CPP, CEM_CPP, MPPI_CPP, Sparse_CPP, Sparse_FOP, Gaussian_CPP
N_W_SAMPLE: 15 #34 # number of lateral offset samples
N_S_SAMPLE: 15 #28 # number of longitudinal speed samples
N_T_SAMPLE: 15 #20 # number of time horizon samples
SAVE_GIF: True # save the animation as a .gif file
SAVE_MEASUREMENTS: False # save the measurement data as .csv file
Num_Threads_For_CollisionChecker: 16 # number of threads to be used in the numba parallel collision checker
Runtime_Measurement: False # keep it False if you need Save GIF
Collect_Data_For_ML: False # Collect data for ML training, check code in fiss_plus_planner/planners/frenet_optimal_planner.py
SHOW_SAMPLED_TRAJECTORIES: False # visualize the sampled trajectories in the animation, set it to False, it show only the selected best trajectory of each time step

# J_D (distance to obstacles) in the planning cost of the Python planners. False reproduces the measurements of
# the Sparse Planner paper (made before J_D was added to the planning cost); the final trajectory cost always has it.
PLANNING_OBSTACLE_COST: True
SP_NUM_SAMPLES: 64 # CVAE samples per cycle of Sparse_FOP (SP); its FOP fallback uses the N_W x N_S x N_T grid
SP_CVAE: "paper" # "paper": target statistics + Resize of the paper measurements (planners/sparse_planning/cvae_paper.py); "submodule": CVAE_efficient_sampling/CVAE.py
SP_FALLBACK: True # False: a cycle of Sparse_FOP / Sparse_CPP without a feasible CVAE sample fails (ablation)
SP_CVAE_BACKEND: "graph_fp16" # Sparse_CPP: CVAE inference as a CUDA graph (graph_fp16 / graph_fp32) or "eager" (the draws of Sparse_FOP)
SP_GAUSSIAN_WEIGHTS: "data/output/sp_sampler/runs/gaussian_s0/best.pt" # Gaussian_CPP: checkpoint of scripts/train_sp_sampler.py (conditional Gaussian / mixture instead of the CVAE)

# Safe following distance of the Python planners (FOP, FISS+, CEM, MPPI, Sparse_FOP; port of the C++ check of the
# Experiment branch): from clearance_grace_time on, every trajectory step keeps gap >= clearance_min_gap +
# clearance_time_gap * v to obstacles ahead in the ego path (gap: ego front to obstacle rear). If the gap is already
# smaller when an obstacle is first met, the requirement grows from that gap to the target within
# clearance_recovery_time. Off reproduces the Sparse Planner paper.
SAFETY:
  check_clearance: False
  clearance_time_gap: 2.0        # [s]
  clearance_min_gap: 3.0         # [m]
  clearance_lateral_margin: 0.2  # [m] added on each ego side for the in-path test
  clearance_grace_time: 1.0      # [s] start of the horizon without the requirement
  clearance_recovery_time: 3.0   # [s] time to restore a gap below the target
  clearance_fallback: True       # plan the cycle without it if no candidate keeps the gap

# Iterative sampling planners CEM / MPPI (Python FOP) and CEM_CPP / MPPI_CPP (C++ FOP): Gaussian sampler over d, v, T in
# the sampling ranges of FOP. population (samples per iteration) defaults to N_W * N_S * N_T / num_iterations, the
# budget of the FOP grid.
CEM:
  num_iterations: 8    # proposal updates per cycle
  elite_fraction: 0.1  # share of the population refitted as elite set
  smoothing: 0.7       # weight of the elite fit vs. the previous proposal
  init_std: 0.3        # initial std in unit coordinates of the sampling ranges
  seed: 0
MPPI:
  num_iterations: 8
  temperature: 0.1     # gamma on the per-iteration normalized cost
  learning_rate: 0.7   # eta of the mean / covariance update
  init_std: 0.3
  seed: 0
