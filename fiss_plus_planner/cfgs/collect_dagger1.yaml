# DAgger round 1 (Ross et al. 2011) on data/10k/Train: CVAE-FOP (section CVAE_FOP, the v3 model) drives, and the
# CEM of the data collection (section CEM, every candidate recorded) plans in every state it reaches; the CEM plans
# are the labels (OUTPUT_DIR/cem_data, the format of collect_train_v3) and are never executed. Train on the
# aggregate of the v3 CEM data and this one (train_cost_cvae.py --cache <v3 cache> <dagger1 cache>).
# Needs C_Planner built with -DENABLE_DATA_COLLECTION=ON. Run: SHARDS=12 bash scripts/run_collection.sh cfgs/collect_dagger1.yaml
#Important parameter relevant to runtime：
#   self.min_t = 3.0 #check the code in fiss_plus_planner/planners/frenet_optimal_planner.py      
#   self.max_t = 5.0  
OUTPUT_DIR: "data/output/dagger1_train/"
MEASUREMENTS_DIR: "data/measurements/dagger1_train"
# INPUT_DIR: "data/demo/selected_scenarios/Test" # the directory where the scenario files are located, it should contain the xml files of the scenarios to be tested, you can specify the scenario files to be tested by editing the FILES parameter below, if FILES is empty, it will run all the scenario files under this directory
INPUT_DIR: "data/10k/Train"
FILES: [] # empty by default if you want to run all the scenario files under the input directory

PLANNER: "CVAE_FOP" # the learner drives; the CEM section is the expert (DAgger)
N_W_SAMPLE: 10 #34 # number of lateral offset samples
N_S_SAMPLE: 10 #28 # number of longitudinal speed samples
N_T_SAMPLE: 10 #20 # number of time horizon samples
SAVE_GIF: False # save the animation as a .gif file
SAVE_MEASUREMENTS: True # outcome of the CVAE-FOP runs on Train
Num_Threads_For_CollisionChecker: 1 # threads per planner (C++ evaluation, numba collision checker); 1 when running parallel --num_shards processes
Runtime_Measurement: True # False keeps every trajectory for SAVE_GIF (several GB per process)
# ML training data via planners/benchmark/planning.py: FOP_CPP saves the planned paths, CEM_CPP every
# candidate with all constraint labels (OUTPUT_DIR/cem_data, needs C_Planner built with
# -DENABLE_DATA_COLLECTION=ON). Use Runtime_Measurement: True and SAVE_GIF: False while collecting.
Collect_Data_For_ML: True
# World-model CVAE data of the CEM collection (cem_data/<scenario>/sampled_vars.parquet, merged by
# scripts/merge_wm_data.py): per cycle the executed plan + `samples` other feasible candidates drawn with
# probability exp(-J~/tau) / q(z), with x, y, yaw in the ego frame (planning.wm_samples)
ML_DATA:
  samples: 16
  tau: 0.25
  seed: 0
SHOW_SAMPLED_TRAJECTORIES: False # visualize the sampled trajectories in the animation, set it to False, it show only the selected best trajectory of each time step

# Safe following distance of the C++ planners (FOP_CPP, FISS+_CPP, CEM_CPP, MPPI_CPP): from
# clearance_grace_time on, every trajectory step keeps gap >= clearance_min_gap +
# clearance_time_gap * v to obstacles ahead in the ego path (gap: ego front to obstacle rear).
# If the gap is already smaller when an obstacle is first met, the requirement grows from
# that gap to the target within clearance_recovery_time.
SAFETY:
  check_clearance: True
  clearance_time_gap: 2.0        # [s]
  clearance_min_gap: 3.0         # [m]
  clearance_lateral_margin: 0.2  # [m] added on each ego side for the in-path test
  clearance_grace_time: 1.0      # [s] start of the horizon without the requirement
  clearance_recovery_time: 3.0   # [s] time to restore a gap below the target
  clearance_fallback: True       # plan without it if no candidate keeps the gap

# Lateral motion model of the C++ planners: below low_speed_threshold the lateral motion is a
# quintic in the travelled arc length d(s) (Werling's thesis Sec. 3.5.1, as in the CommonRoad
# reactive planner), so the vehicle can stop, wait and start again without moving sideways.
MOTION_MODEL:
  low_speed_threshold: 4.0           # [m/s] start speed below which d(s) is used
  low_speed_min_lateral_length: 5.0  # [m] lower bound of the lateral arc length

# Iterative sampling planners (FOP backend, Gaussian sampler over d, v, T). Trajectories per
# planning cycle = num_iterations * population; N_*_SAMPLE above are not used by them.
CEM:
  num_iterations: 8    # proposal updates per cycle (8 x 250 for the CVAE data collection, see cem_tune_test)
  population: 250      # samples per iteration
  elite_fraction: 0.1  # share of the population refitted as elite set
  smoothing: 0.7       # weight of the elite fit vs. the previous proposal
  init_std: 0.3        # initial std in unit coordinates of the search space
  seed: 0
MPPI:
  num_iterations: 4
  population: 250
  temperature: 0.1     # gamma on the per-iteration normalized cost
  learning_rate: 0.7   # eta of the mean / covariance update
  init_std: 0.3
  seed: 0

# The learner (as cfgs/cvae_fop.yaml: K 16, warm start)
CVAE_FOP:
  run: "data/output/cvae_local/runs/v3_attn_tau0.25_beta0.1"   # v3 image-only model
  num_samples: 16
  sampler: "cvae"
  seed: 0
  warm_start: True
  log_cycles: False
  regret: False
