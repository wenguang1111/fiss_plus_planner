# GIFs of the 7 Test scenarios that CVAE + CEM fallback (B_cem) fails but CEM alone completes.
# = data/measurements/cvae_B_cem/config.yaml with INPUT_DIR, output paths, SAVE_GIF on, Runtime_Measurement off.
#     cd fiss_plus_planner && python scripts/demo_cr.py --cfg_file cfgs/gif_cem_fallback_failed.yaml
# GIFs: data/output/gif_cem_fallback_failed/gif/CVAE_FOP/<scenario>.gif, cycle log: .../cvae_cycles/<scenario>.csv
OUTPUT_DIR: data/output/gif_cem_fallback_failed/
MEASUREMENTS_DIR: data/measurements/gif_cem_fallback_failed
INPUT_DIR: data/10k/Test_cem_fallback_failed
FILES: []
PLANNER: CVAE_FOP
N_W_SAMPLE: 10
N_S_SAMPLE: 10
N_T_SAMPLE: 10
SAVE_GIF: true
SAVE_MEASUREMENTS: true
Num_Threads_For_CollisionChecker: 1
Runtime_Measurement: false
Collect_Data_For_ML: false
SHOW_SAMPLED_TRAJECTORIES: false
SAFETY:
  check_clearance: true
  clearance_time_gap: 2.0
  clearance_min_gap: 3.0
  clearance_lateral_margin: 0.2
  clearance_grace_time: 1.0
  clearance_recovery_time: 3.0
  clearance_fallback: true
MOTION_MODEL:
  low_speed_threshold: 4.0
  low_speed_min_lateral_length: 5.0
CEM:
  num_iterations: 8
  population: 250
  elite_fraction: 0.1
  smoothing: 0.7
  init_std: 0.3
  seed: 0
MPPI:
  num_iterations: 4
  population: 250
  temperature: 0.1
  learning_rate: 0.7
  init_std: 0.3
  seed: 0
CVAE_FOP:
  run: data/output/cvae_local/runs/v3_draws2_tau0.05_beta0.1
  num_samples: 16
  sampler: cvae
  seed: 0
  warm_start: true
  log_cycles: true
  regret: false
  fallback: cem
